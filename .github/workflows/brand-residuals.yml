name: LLM Pulse CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-brand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The scan is written against ripgrep and refuses to run without it.
      # Neither runner image ships it, which is why this job had never
      # actually reached the scan.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Scan current identity files
        run: make check-brand

  check-shell:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The release pipeline is over 1400 lines of bash whose failure modes are
      # expensive and late. It currently reports zero findings at the strictest
      # level, so the baseline is kept at zero rather than allowed to grow.
      - name: Lint shell scripts
        run: shellcheck --severity=style --format=gcc scripts/*.sh Plugin/hooks/*.sh

  macos-check:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # `validate_build_number_is_new` reads shipped build numbers out of
          # the release tags, so a shallow clone would silently skip the check.
          fetch-depth: 0

      - name: Install ripgrep
        run: brew install ripgrep

      - name: Install pinned XcodeGen
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            --output "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
          echo "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef  $RUNNER_TEMP/xcodegen.zip" \
            | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Verify XcodeGen version
        run: |
          test "$(xcodegen --version)" = "Version: 2.45.4"

      - name: Run brand, Swift, plugin, release-tool, localization, and Debug build checks
        run: make check

      - name: Reject generated project drift
        run: |
          xcodegen generate
          git diff --exit-code -- LLMPulse.xcodeproj

      # Everything below the build — signing order, Sparkle XPC stripping, DMG
      # layout, the two-hop appcast, EdDSA verification — used to be exercised
      # for the first time on release day, on one laptop. A dry run executes no
      # mutating command and needs no signing secrets, so every preflight and
      # every stage ordering check can run here instead.
      - name: Rehearse the release pipeline
        env:
          DRY_RUN: "1"
          # Skips the keychain lookup; nothing is signed during a dry run.
          SIGNING_IDENTITY: dry-run-placeholder
        run: |
          bash scripts/release.sh \
            --stage all \
            --allow-dirty \
            --output-dir "$RUNNER_TEMP/release-rehearsal"

      - name: Build Universal Release
        run: |
          xcodebuild \
            -project LLMPulse.xcodeproj \
            -scheme LLMPulse \
            -configuration Release \
            -derivedDataPath .build/DerivedData \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64 x86_64" \
            build
          ARCHS_FOUND="$(lipo -archs '.build/DerivedData/Build/Products/Release/LLM Pulse.app/Contents/MacOS/LLM Pulse')"
          test "$ARCHS_FOUND" = "x86_64 arm64" || test "$ARCHS_FOUND" = "arm64 x86_64"
